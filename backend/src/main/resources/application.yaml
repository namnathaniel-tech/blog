spring:
  application:
    name: blog
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # Flyway owns the schema. Never change this.
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  session:
    timeout: 30d               # Spring Session ignores server.servlet.session.timeout; set it here
    jdbc:
      initialize-schema: never   # tables created by Flyway V2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:8080}                     # Railway/Render inject PORT
  # Tomcat RemoteIpValve: reads X-Forwarded-For right-to-left and trusts only internal proxy IPs
  # (10/8, 172.16/12, 192.168/16, 100.64/10, 127/8), so clients can't spoof their IP to dodge
  # rate limits. Do NOT switch to `framework` (it trusts the client-supplied left-most value).
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30d
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:true}

management:
  health:
    mail:
      enabled: false   # an SMTP outage must not fail Railway's health check
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

blog:
  site-name: ${BLOG_SITE_NAME:My Project Blog}
  site-description: ${BLOG_SITE_DESCRIPTION:Notes and write-ups on things I build.}
  base-url: ${BLOG_BASE_URL:http://localhost:5173}
  version: '@project.version@'
  admin-email: ${ADMIN_EMAIL:admin@example.com}
  mail-from: ${MAIL_FROM:blog@example.com}
  author-name: ${BLOG_AUTHOR_NAME:The Author}
  ip-hash-salt: ${IP_HASH_SALT:dev-only-ip-salt-change-me}
